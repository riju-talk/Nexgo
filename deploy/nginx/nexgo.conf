# NEXGO on EC2: nginx runs on the HOST (not in docker) and is the only public entrance.
# Containers listen on 127.0.0.1:3021 (web) and 127.0.0.1:4010 (api).
#
# Install:  sudo cp deploy/nginx/nexgo.conf /etc/nginx/conf.d/nexgo.conf
#           sudo sed -i 's/app.example.com/YOUR.DOMAIN/g' /etc/nginx/conf.d/nexgo.conf
#           sudo nginx -t && sudo systemctl reload nginx
# TLS:      sudo certbot --nginx -d YOUR.DOMAIN      (certbot edits the 443 block below; keep the 80 block)
# No domain yet? Use the "plain http" server block at the bottom instead and set COOKIE_SECURE=false in .env.

limit_req_zone $binary_remote_addr zone=nx_auth:10m rate=20r/m;

upstream nexgo_web { server 127.0.0.1:3021; keepalive 16; }
upstream nexgo_api { server 127.0.0.1:4010; keepalive 16; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    # certbot fills these in; until then point them at any certificate you have.
    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 10m;          # KYC / logo uploads are base64 JSON, up to ~4 MB

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;   # API runs with TRUST_PROXY=true
    proxy_set_header X-Forwarded-Proto $scheme;

    # Sign-in endpoints get an extra nginx-level brake on top of the API's own rate limit.
    location ~ ^/v1/(auth/(login|signup|forgot-password|reset-password)|admin/auth/) {
        limit_req zone=nx_auth burst=10 nodelay;
        proxy_pass http://nexgo_api;
    }

    # Webhooks need the raw body untouched and can be slow to answer.
    location /v1/webhooks/ {
        proxy_read_timeout 60s;
        proxy_pass http://nexgo_api;
    }

    location /v1/ {
        proxy_read_timeout 60s;
        proxy_pass http://nexgo_api;
    }

    # Liveness for load balancers / uptime checks (no auth, no DB).
    location = /health { proxy_pass http://nexgo_api; access_log off; }

    # Everything else is the Next.js app.
    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://nexgo_web;
    }
}

