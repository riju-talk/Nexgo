# NEXGO behind an AWS Application Load Balancer. The ALB terminates TLS and sends plain http to port 80 here.
# Install: sudo cp deploy/nginx/nexgo-alb.conf /etc/nginx/conf.d/nexgo.conf && sudo nginx -t && sudo systemctl reload nginx

# Trust the ALB (default VPC range) so $remote_addr is the real visitor, not the load balancer.
set_real_ip_from 172.31.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=nx_auth:10m rate=20r/m;

upstream nexgo_web { server 127.0.0.1:3021; keepalive 16; }
upstream nexgo_api { server 127.0.0.1:4010; keepalive 16; }

# Original scheme as seen by the visitor (https at the ALB).
map $http_x_forwarded_proto $nx_proto { default $http_x_forwarded_proto; '' $scheme; }
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $nx_proto;

    # ALB health check. While /etc/nginx/drain.flag exists it answers 503, so the ALB stops sending traffic
    # here before a deploy restarts the containers (see deploy/ec2/rolling-deploy.sh).
    location = /health {
        if (-f /etc/nginx/drain.flag) { return 503; }
        proxy_pass http://nexgo_api;
        access_log off;
    }

    location ~ ^/v1/(auth/(login|signup|forgot-password|reset-password)|admin/auth/) {
        limit_req zone=nx_auth burst=10 nodelay;
        proxy_pass http://nexgo_api;
    }

    location /v1/ {
        proxy_read_timeout 60s;
        proxy_pass http://nexgo_api;
    }

    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://nexgo_web;
    }
}
