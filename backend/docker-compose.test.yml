# Docker Compose configuration for test environment
# Usage: docker-compose -f docker-compose.test.yml up

version: '3.8'

services:
  # Test PostgreSQL database
  test-db:
    image: postgres:17-alpine
    container_name: nexgo-test-db
    environment:
      POSTGRES_DB: nexgo_test
      POSTGRES_USER: nexgo_test
      POSTGRES_PASSWORD: test_password
      # Performance tuning for faster tests
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5433:5432"
    volumes:
      - test-db-data:/var/lib/postgresql/data
      # Optional: Load schema on startup
      # - ./src/db/migrations:/docker-entrypoint-initdb.d
    command:
      - "postgres"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexgo_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  # Optional: Test Redis for caching/sessions
  test-redis:
    image: redis:7-alpine
    container_name: nexgo-test-redis
    ports:
      - "6380:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - test-network

volumes:
  test-db-data:
    driver: local

networks:
  test-network:
    driver: bridge
